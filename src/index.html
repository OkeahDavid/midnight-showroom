<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Midnight Showroom</title>
  <meta name="description" content="A night-time car showroom in your browser. Cars assemble part by part, drive in and out, and come with real specs and factory colours." />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <meta name="theme-color" content="#1f1f1f" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="locked">
  <canvas id="scene"></canvas>

  <div id="loader">
    <span class="loader-label">Loading model</span>
    <span id="loader-pct">0%</span>
  </div>

  <header class="topbar">
    <a class="wordmark" href="./">Midnight Showroom</a>
    <nav id="picker" aria-label="Choose a car"></nav>
    <a class="about-link" href="./about.html">About</a>
  </header>

  <main id="track">
    <section class="panel hero">
      <p class="kicker" id="hero-brand"></p>
      <h1 id="hero-model"></h1>
      <p class="years" id="hero-years"></p>
      <p class="lede" id="hero-lede"></p>
      <p class="scroll-hint">Scroll</p>
    </section>

    <section class="panel right">
      <p class="kicker">01 / Performance</p>
      <h2>By the numbers</h2>
      <dl id="specs" class="specs"></dl>
    </section>

    <section class="panel">
      <p class="kicker">02 / Story</p>
      <h2>Where it came from</h2>
      <div id="story" class="story"></div>
    </section>

    <section class="panel right">
      <p class="kicker">03 / Details</p>
      <h2>Worth knowing</h2>
      <ul id="details" class="details"></ul>
    </section>

    <section class="panel paint">
      <p class="kicker">04 / Paint</p>
      <h2>Pick a colour</h2>
      <p id="paint-note" class="paint-note"></p>
      <div id="swatches" role="radiogroup" aria-label="Paint colour"></div>
    </section>
  </main>


  <script type="module" src="./main.js"></script>
</body>
</html>
